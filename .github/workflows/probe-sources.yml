name: Probe sources

# Run by hand from the Actions tab. Checks candidate event sources from
# GitHub's servers, where the digest runs, and writes a table to the run's
# summary page. Sends nothing.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python probe.py
